map $http_user_agent $hermes_mobile_ua {
    default 0;
    ~*(iphone|ipod|android.*mobile|windows.phone|mobile.safari) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /__hermes_mobile_chrome.js {
        add_header Cache-Control "no-store, max-age=0";
        try_files /__hermes_mobile_chrome.js =404;
    }

    location ~ ^/(?<build_path>.+)/document\.pdf$ {
        if ($hermes_mobile_ua) {
            return 302 /$build_path/index.html;
        }
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, max-age=0";
        sub_filter_once off;
        sub_filter '<head>' '<head><script>(function(){try{if(window.matchMedia&&!window.matchMedia("(max-width:760px)").matches)return;var d=document,h=d.head||d.documentElement;function m(n,c){var e=d.querySelector("meta[name="+JSON.stringify(n)+"]");if(!e){e=d.createElement("meta");e.name=n;h.appendChild(e)}e.content=c}m("theme-color","#0b0f11");m("apple-mobile-web-app-status-bar-style","black-translucent");var v=d.querySelector("meta[name=viewport]");if(v&&!/viewport-fit=/.test(v.content)){v.content=v.content+", viewport-fit=cover"}}catch(e){}})();</script><style id="hermes-build-mobile-preflight">@media screen and (max-width:760px){html,body{max-width:100vw;overflow-x:hidden;background:#0b0f11}.sheet,.page,main[data-od-id],[data-od-id]{transform-origin:top center!important}}</style>';
        sub_filter '</head>' '<script src="/__hermes_mobile_chrome.js?v=2" defer></script></head>';
        try_files $uri $uri/ =404;
    }
}
